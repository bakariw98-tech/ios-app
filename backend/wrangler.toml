name = "conversation-delegation"
main = "src/index.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Workers have no cold start, which is why the backend lives here: Vapi's
# assistant-request has a ~7.5 second budget, and a free-tier container that
# spins down would blow it and drop the call. See docs/SETUP.md.

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "conversation-delegation"
database_id = "c533ed3b-93ac-4f3b-8802-ad5fd73dafb5"

# CallRelay (src/relay/CallRelay.ts) — the Twilio migration's Durable Object,
# one instance per live call, bridging a Twilio Media Stream WebSocket to an
# OpenAI Realtime WebSocket. See docs/technical-decisions.md ADR-006.
[[durable_objects.bindings]]
name = "CALL_RELAY"
class_name = "CallRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRelay"]

# Secrets are NOT set here — they'd end up in git. Set them with
# `wrangler secret put <NAME>` or in the Cloudflare dashboard under
# Workers → conversation-delegation → Settings → Variables and Secrets:
#
#   VAPI_API_KEY
#   VAPI_WEBHOOK_SECRET
#   VAPI_PHONE_NUMBER
#   PUBLIC_SERVER_URL   (your workers.dev URL, no trailing slash — shared
#                        with the Twilio secrets below)
#
# VAPI_PHONE_NUMBER_ID is optional — nothing currently reads it — so don't
# spend time hunting for it in Vapi's dashboard.
#
# Twilio phone mode (new backend, ADR-006) — all four required together:
#
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_PHONE_NUMBER
#   PUBLIC_SERVER_URL   (same value as above)
#
# Twilio phone mode also needs OPENAI_API_KEY set (see lib/config.ts) —
# unlike Vapi, this backend talks to OpenAI directly.
