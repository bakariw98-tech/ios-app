name: Backend

# Tests run on every push and pull request. Deploy runs on pushes to the
# branches below, after tests pass.
#
# This is the active deploy path — CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set as repository secrets.
#
# If you ever also connect the repo via Cloudflare Workers Builds, turn one of
# them off. Two deploy mechanisms on the same push race each other, and the
# loser silently overwrites the winner.

on:
  push:
    branches:
      - main
      - claude/conversation-delegation-app-6m6kat
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Includes the compliance suite. A failure here means the disclosure
      # guarantees are broken — the deploy must not proceed.
      - run: npm test

  deploy:
    needs: test
    # Never deploy from a pull request — PR builds can come from forks and
    # would expose the Cloudflare token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply D1 schema
        # Idempotent — every statement is CREATE ... IF NOT EXISTS.
        run: npx wrangler d1 execute conversation-delegation --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
