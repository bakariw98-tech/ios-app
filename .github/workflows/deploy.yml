name: Backend

# Tests run on every push. Deploy is manual-only.
#
# The recommended deploy path is Cloudflare Workers Builds, which pulls from
# this repo directly and needs no GitHub secrets (see docs/SETUP.md). If both
# that and a push-triggered deploy here were active, two deploys would race on
# every commit — so this workflow deploys only when you run it by hand from the
# Actions tab, and only if CLOUDFLARE_API_TOKEN is set.

on:
  push:
    branches:
      - main
      - claude/conversation-delegation-app-6m6kat
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Includes the compliance suite. A failure here means the disclosure
      # guarantees are broken — the deploy must not proceed.
      - run: npm test

  deploy:
    needs: test
    # Manual only — Workers Builds handles push deploys. See the header.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply D1 schema
        # Idempotent — every statement is CREATE ... IF NOT EXISTS.
        run: npx wrangler d1 execute conversation-delegation --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
