name: Deploy backend

# Deploys the Worker on every push to the feature branch or main.
#
# This exists so nobody has to run a command locally. Push, and GitHub Actions
# runs tests then deploys. Secrets live in GitHub (repo → Settings → Secrets and
# variables → Actions) and in Cloudflare — never in the repo.

on:
  push:
    branches:
      - main
      - claude/conversation-delegation-app-6m6kat
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Includes the compliance suite. A failure here means the disclosure
      # guarantees are broken — the deploy must not proceed.
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply D1 schema
        # Idempotent — every statement is CREATE ... IF NOT EXISTS.
        run: npx wrangler d1 execute conversation-delegation --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
