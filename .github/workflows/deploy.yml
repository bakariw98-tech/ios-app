name: Backend

# Tests run on every push and pull request. Deploy runs on pushes to the
# branches below, after tests pass.
#
# This is the active deploy path — CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set as repository secrets.
#
# If you ever also connect the repo via Cloudflare Workers Builds, turn one of
# them off. Two deploy mechanisms on the same push race each other, and the
# loser silently overwrites the winner.

on:
  push:
    branches:
      - main
      - claude/conversation-delegation-app-6m6kat
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Includes the compliance suite. A failure here means the disclosure
      # guarantees are broken — the deploy must not proceed.
      - run: npm test

  deploy:
    needs: test
    # Never deploy from a pull request — PR builds can come from forks and
    # would expose the Cloudflare token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Fail fast with a readable message. Without this, a bad token surfaces
      # as an opaque "Authentication error [code: 10000]" from whichever
      # Cloudflare call happens to run first.
      - name: Verify Cloudflare credentials
        run: |
          # Shape check before the API call. This never prints the token —
          # only its length and whether it contains characters that cannot
          # legally appear in an Authorization header. Cloudflare API tokens
          # are 40 characters of [A-Za-z0-9_-].
          len=${#CLOUDFLARE_API_TOKEN}
          lines=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | wc -l)
          echo "Token length: $len (expected 40)"

          if [ "$len" -eq 0 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or not set."
            exit 1
          fi

          if [ "$lines" -ne 0 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains a line break."
            echo "::error::Re-copy it as a single line with no trailing newline."
            exit 1
          fi

          # Everything outside [A-Za-z0-9_-] cannot be part of a real token, so
          # printing just those characters identifies the mistake without
          # revealing any token material.
          contamination=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C tr -d 'A-Za-z0-9_-')
          if [ -n "$contamination" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains characters that aren't valid in a Cloudflare API token."
            echo "::error::Expected exactly 40 characters of A-Z, a-z, 0-9, underscore or hyphen."
            echo "::error::The offending characters are shown between the arrows below."
            echo "::error::(These cannot be part of a real token, so nothing secret is revealed.)"
            printf '::error::>>>%s<<<\n' "$(printf '%s' "$contamination" | LC_ALL=C sed -n l | tr -d '\n')"
            echo "::error::If you see a colon and spaces, you copied the 'Authorization: Bearer <token>' line."
            echo "::error::If you see quotes, the quotes were pasted along with the value."
            echo "::error::Paste ONLY the token itself — use Cloudflare's Copy button on the token screen."
            exit 1
          fi

          if [ "$len" -ne 40 ]; then
            echo "::warning::Token is $len characters; Cloudflare API tokens are normally 40."
          fi

          if ! npx wrangler whoami; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN."
            echo "::error::Check it is an API *Token* (My Profile → API Tokens → Create Token)."
            echo "::error::A Global API Key will NOT work here — different auth scheme."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 schema
        # Idempotent — every statement is CREATE ... IF NOT EXISTS.
        run: npx wrangler d1 execute conversation-delegation --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
